name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; cancel any older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # We deploy the whole repo so `app/` can fetch `../data/songs.json`.
      # The Python scripts in `scripts/` ship along but are harmless static
      # files from Pages' point of view — they won't execute.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
